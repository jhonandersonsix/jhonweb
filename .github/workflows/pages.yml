# Publica la carpeta web/ en GitHub Pages cada vez que se sube un cambio a main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # 404.html usa rutas que empiezan con "/". En GitHub Pages la web vive en
      # /jhonweb/, así que se les agrega ese prefijo. Con dominio propio queda vacío.
      - name: Ajustar rutas de la página 404
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          sed -i -E "s#(href|src)=\"/([^/])#\1=\"${BASE}/\2#g; s#url\(/([^/])#url(${BASE}/\1#g" web/404.html
          grep -n 'href="\|src="\|url(' web/404.html | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
