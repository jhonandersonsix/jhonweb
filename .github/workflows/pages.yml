# Prepara la carpeta web/ y la deja en la rama gh-pages cada vez que se sube un
# cambio a main. GitHub Pages publica esa rama (Settings → Pages → Deploy from a branch).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 404.html usa rutas que empiezan con "/". En GitHub Pages la web vive en
      # /jhonweb/, así que se les agrega ese prefijo. Si hay dominio propio
      # (archivo web/CNAME), la web vive en la raíz y no se cambia nada.
      - name: Preparar la web
        run: |
          rm -rf salida && cp -r web salida
          touch salida/.nojekyll
          if [ ! -f web/CNAME ]; then
            BASE="/${GITHUB_REPOSITORY#*/}"
            sed -i -E "s#(href|src)=\"/([^/])#\1=\"${BASE}/\2#g; s#url\(/([^/])#url(${BASE}/\1#g" salida/404.html
          fi

      - name: Subir a la rama gh-pages
        run: |
          cd salida
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
